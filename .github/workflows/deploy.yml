name: Deploy
on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Download deps
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test --coverage

      - name: Build
        run: pnpm run build